version: 1

server:
  host: "0.0.0.0"
  port: 8080

database:
  url: "${DATABASE_URL:-postgresql://postgres:postgres@127.0.0.1:5432/postgres}"
  exposeErrorDetails: false
  queryUrls: {}
  pool:
    min: 2
    queryMin: 2
    max: 25
    maxGlobalQueries: 80

redis:
  enabled: true
  mode: external
  url: "${REDIS_URL:-redis://127.0.0.1:6379}"

ratelimit:
  enabled: true
  requestPerMinute: 1000
  requestPerMinutePerIp: 1000
  whitelistedIPs: []

transactions:
  retentionDays: 30

analytics:
  # Counts completed query attempts by API-key ID and stores details only for failures.
  enabled: true
  # Contains analytics.sqlite and the emergency shutdown spool.
  directory: "./data/analytics"
  # Applies to failed-query details; cumulative per-key counters are retained.
  retentionDays: 30
  # Quota covers the SQLite database, WAL/SHM files, and shutdown spool.
  maxStorageBytes: 67108864
  # false removes comments and replaces common SQL literals before storage.
  storeFullSql: false
